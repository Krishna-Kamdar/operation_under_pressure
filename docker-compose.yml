services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ops_pressure
      POSTGRES_USER: ops_pressure
      POSTGRES_PASSWORD: ops_pressure_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_pressure -d ops_pressure"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
